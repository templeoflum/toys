for (const line of raw) {
  const m = line.match(/^\|\s*(\d{8}-\d{6})\s*\|\s*(\S+)\s*\|\s*(.*?)\s*\|?\s*$/);
  if (m) rows.push({ ts: m[1], from: m[2], body: m[3] });
}
function needOf(b) {
  const m = b.match(/needs:\s*(nothing|read|word|signature|play|fold-in)/i);
  if (m) return m[1].toLowerCase();
  if (/NEEDS\s+(SIGNATURE|READ|signature|read)/.test(b)) return RegExp.$1.toLowerCase();
  return null;
}
function sigOf(b) {
  const env = b.split('·');
  if (env.length >= 2 && env[0].length < 60) return env.slice(0, 2).join('·');
  const cut = b.replace(/^@\S+\s*/, '');
  return cut.length > 110 ? cut.slice(0, 110) + '…' : cut;
}
const river = document.getElementById('river');
const tray = document.getElementById('needs-tray');
function render(r) {
  const need = needOf(r.body);
  const forOp = /@hedawn/.test(r.body) || r.from === 'hedawn';
  const div = document.createElement('div');
  div.className = 'row' + ((need && need !== 'nothing' && forOp) ? ' amber' : '');
  div.innerHTML = '<div class="tele"><span class="ts">' + r.ts.slice(9, 13) + '</span>' +
    '<span class="from">' + r.from + '</span>' +
    '<span class="sig"></span>' +
    (need ? '<span class="need">' + need.toUpperCase() + '</span>' : '') + '</div>' +
    '<div class="letter"></div>';
  div.querySelector('.sig').textContent = sigOf(r.body);
  div.querySelector('.letter').textContent = r.body;
  div.onclick = () => div.classList.toggle('open');
  river.appendChild(div);
  if (need && need !== 'nothing' && r.from !== 'hedawn' && /@hedawn/.test(r.body)) {
    const t = document.createElement('div');
    t.className = 't-row';
    t.textContent = r.from + ' · ' + need + ' · ' + sigOf(r.body).slice(0, 80);
    t.onclick = () => { div.classList.add('open'); div.scrollIntoView({ block: 'center' }); };
    tray.appendChild(t);
  }
}
rows.forEach(render);
river.scrollTop = river.scrollHeight;

let aim = 'board';
for (const a of document.querySelectorAll('.aim')) {
  a.onclick = () => {
    aim = a.dataset.a;
    for (const x of document.querySelectorAll('.aim')) x.classList.toggle('on', x === a);
  };
}
document.getElementById('line').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    const now = new Date();
    const p = n => String(n).padStart(2, '0');
    render({
      ts: '' + now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) + '-' +
        p(now.getHours()) + p(now.getMinutes()) + p(now.getSeconds()),
      from: 'hedawn',
      body: (aim === 'board' ? '' : '@' + aim + ' ') + e.target.value.trim(),
    });
    e.target.value = '';
    river.scrollTop = river.scrollHeight;
  }
});
document.getElementById('raise').onclick = () =>
  document.getElementById('popup-wrap').classList.add('up');
</script>
</body>
</html>
